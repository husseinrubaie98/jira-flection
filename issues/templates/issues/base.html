<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jira-Flection{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Reset & Base ──────────────────────────────── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary:   #0f1117;
            --bg-secondary: #161822;
            --bg-card:      #1c1f2e;
            --bg-hover:     #252840;
            --border:       #2a2d42;
            --accent:       #6366f1;
            --accent-hover: #818cf8;
            --accent-glow:  rgba(99, 102, 241, .25);
            --text-primary: #e2e8f0;
            --text-secondary:#94a3b8;
            --text-muted:   #64748b;
            --success:      #22c55e;
            --warning:      #f59e0b;
            --danger:       #ef4444;
            --radius:       10px;
            --shadow:       0 4px 24px rgba(0,0,0,.35);
        }

        html { font-size: 15px; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }

        /* ── Sidebar ───────────────────────────────────── */
        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 100;
        }
        .sidebar-brand {
            padding: 1.5rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: .65rem;
            text-decoration: none;
        }
        .sidebar-brand .logo {
            width: 34px; height: 34px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            border-radius: 8px;
            display: grid; place-items: center;
            font-weight: 700; font-size: .9rem; color: #fff;
        }
        .sidebar-brand h1 {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-hover), #c4b5fd);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-nav { flex: 1; padding: .75rem 0; }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: .7rem;
            padding: .7rem 1.25rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: .9rem;
            font-weight: 500;
            transition: all .2s;
            border-left: 3px solid transparent;
        }
        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            color: var(--text-primary);
            background: var(--bg-hover);
            border-left-color: var(--accent);
        }
        .sidebar-nav a .icon {
            font-size: 1.15rem;
            width: 1.5rem;
            text-align: center;
        }

        /* ── Main Content ──────────────────────────────── */
        .main { margin-left: 250px; flex: 1; min-height: 100vh; }

        .topbar {
            padding: 1.2rem 2rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .topbar h2 {
            font-size: 1.15rem;
            font-weight: 600;
        }

        .content { padding: 2rem; }

        /* ── Cards ─────────────────────────────────────── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        /* ── Project Grid ──────────────────────────────── */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            text-decoration: none;
            color: var(--text-primary);
            transition: all .25s;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: var(--shadow);
        }
        .project-card:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,.4), 0 0 0 1px var(--accent-glow);
        }
        .project-avatar {
            width: 44px; height: 44px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--bg-hover);
        }
        .project-info h3 { font-size: .95rem; font-weight: 600; }
        .project-info span {
            font-size: .8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ── Buttons ───────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .65rem 1.3rem;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: .875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: #fff;
            box-shadow: 0 2px 12px var(--accent-glow);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--accent-hover), #8b5cf6);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-primary:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-sm {
            padding: .4rem .85rem;
            font-size: .78rem;
            border-radius: 6px;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent-hover);
            background: rgba(99,102,241,.08);
        }

        /* ── Table ─────────────────────────────────────── */
        .issues-table {
            width: 100%;
            border-collapse: collapse;
        }
        .issues-table th,
        .issues-table td {
            text-align: left;
            padding: .75rem 1rem;
            border-bottom: 1px solid var(--border);
        }
        .issues-table th {
            font-size: .78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--text-muted);
            background: var(--bg-secondary);
        }
        .issues-table tr:hover td {
            background: var(--bg-hover);
        }
        .issue-key {
            font-weight: 600;
            color: var(--accent-hover);
            font-size: .875rem;
        }
        .issue-summary {
            font-size: .9rem;
        }

        /* ── Badges ────────────────────────────────────── */
        .badge {
            display: inline-block;
            padding: .2rem .6rem;
            border-radius: 20px;
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .02em;
        }
        .badge-status {
            background: rgba(99,102,241,.15);
            color: var(--accent-hover);
        }
        .badge-type {
            background: rgba(34,197,94,.12);
            color: var(--success);
        }

        /* ── Accordion (Subtasks) ──────────────────────── */
        .subtask-container { margin-top: .5rem; }
        .accordion-item {
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: .5rem;
            overflow: hidden;
        }
        .accordion-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: .7rem 1rem;
            background: var(--bg-secondary);
            cursor: pointer;
            transition: background .2s;
            user-select: none;
        }
        .accordion-header:hover { background: var(--bg-hover); }
        .accordion-header .left {
            display: flex;
            align-items: center;
            gap: .6rem;
        }
        .accordion-header .chevron {
            transition: transform .25s;
            color: var(--text-muted);
            font-size: .85rem;
        }
        .accordion-header.open .chevron { transform: rotate(90deg); }
        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height .3s ease;
            background: var(--bg-card);
        }
        .accordion-body.open { max-height: 600px; }
        .accordion-body-inner {
            padding: 1rem;
            font-size: .85rem;
            color: var(--text-secondary);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* ── Forms ─────────────────────────────────────── */
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: .82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: .4rem;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .form-control {
            width: 100%;
            padding: .65rem .9rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: .9rem;
            transition: border-color .2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .form-hint {
            font-size: .75rem;
            color: var(--text-muted);
            margin-top: .3rem;
        }

        /* ── Alerts ────────────────────────────────────── */
        .alert {
            padding: 1rem 1.25rem;
            border-radius: 8px;
            font-size: .88rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: flex-start;
            gap: .6rem;
        }
        .alert-error {
            background: rgba(239, 68, 68, .1);
            border: 1px solid rgba(239, 68, 68, .25);
            color: #fca5a5;
        }
        .alert-success {
            background: rgba(34, 197, 94, .1);
            border: 1px solid rgba(34, 197, 94, .25);
            color: #86efac;
        }
        .alert-info {
            background: rgba(99,102,241,.1);
            border: 1px solid rgba(99,102,241,.2);
            color: var(--accent-hover);
        }

        /* ── Spinner ───────────────────────────────────── */
        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-overlay {
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: 2rem;
            justify-content: center;
            color: var(--text-secondary);
            font-size: .9rem;
        }

        /* ── Empty state ───────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
        .empty-state .icon { font-size: 2.5rem; margin-bottom: 1rem; }
        .empty-state h3 {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-bottom: .4rem;
        }
        .empty-state p { font-size: .85rem; }

        /* ── Utilities ─────────────────────────────────── */
        .text-muted { color: var(--text-muted); }
        .mt-1 { margin-top: .5rem; }
        .mt-2 { margin-top: 1rem; }
        .mb-2 { margin-bottom: 1rem; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="{% url 'projects' %}" class="sidebar-brand">
            <div class="logo">JF</div>
            <h1>Jira-Flection</h1>
        </a>
        <nav class="sidebar-nav">
            <a href="{% url 'projects' %}" class="{% block nav_projects %}{% endblock %}">
                <span class="icon">📋</span> Projects
            </a>
            <a href="{% url 'settings' %}" class="{% block nav_settings %}{% endblock %}">
                <span class="icon">⚙️</span> Settings
            </a>
        </nav>
    </aside>

    <!-- Main -->
    <div class="main">
        <div class="topbar">
            <h2>{% block page_title %}Dashboard{% endblock %}</h2>
        </div>
        <div class="content">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
